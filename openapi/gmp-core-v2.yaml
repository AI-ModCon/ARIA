openapi: 3.1.0
info:
  title: GMP Core API
  version: 2.0.0
  description: >-
    Genesis Mission Platform v2 API surface for agent-native identity, negotiation,
    durable execution, memory, accounting, reasoning observability, coordination,
    sandboxed actuation, and supervision.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://api.gmp.example/v2
security:
  - bearerAuth: []
paths:
  /v2/identity/capability-tokens:
    post:
      operationId: mintCapabilityToken
      tags: [IdentityTrustV2]
      summary: Mint short-lived intent-scoped capability token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/common/capability-token.schema.json
      responses:
        '201':
          $ref: '#/components/responses/CapabilityTokenCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/identity/capability-tokens/revoke:
    post:
      operationId: revokeCapabilityToken
      tags: [IdentityTrustV2]
      summary: Revoke capability token during task execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/common/revocation.schema.json
      responses:
        '202':
          $ref: '#/components/responses/AcceptedNoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/identity/capability-tokens/{tokenId}/audit:
    get:
      operationId: getCapabilityTokenAudit
      tags: [IdentityTrustV2]
      summary: Fetch token decision/audit chain
      parameters:
        - in: path
          name: tokenId
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/CapabilityTokenSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/runs:plan:
    post:
      operationId: planRun
      tags: [Negotiation]
      summary: Generate dry run, explain, or clarification plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capabilityId, negotiation]
              properties:
                capabilityId:
                  type: string
                negotiation:
                  $ref: ../schemas/common/negotiation-hint.schema.json
      responses:
        '200':
          $ref: '#/components/responses/RunPlanSuccess'
        '400':
          $ref: '#/components/responses/StructuredErrorBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/runs/{runId}/pause:
    post:
      operationId: pauseRun
      tags: [DurableExecution]
      summary: Pause an active run and checkpoint state
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        '202':
          $ref: '#/components/responses/WorkflowStateAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/runs/{runId}/resume:
    post:
      operationId: resumeRun
      tags: [DurableExecution]
      summary: Resume a paused run from checkpoint
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/common/resume-token.schema.json
      responses:
        '202':
          $ref: '#/components/responses/WorkflowStateAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/runs/{runId}/checkpoints:
    get:
      operationId: listRunCheckpoints
      tags: [DurableExecution]
      summary: List replay-safe checkpoints for a run
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/CheckpointListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/memory/records:
    post:
      operationId: writeMemoryRecord
      tags: [Memory]
      summary: Persist a managed memory record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/common/memory-record.schema.json
      responses:
        '201':
          $ref: '#/components/responses/MemoryRecordCreated'
        '400':
          $ref: '#/components/responses/StructuredErrorBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/memory/query:
    post:
      operationId: queryMemoryRecords
      tags: [Memory]
      summary: Query managed memory records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, query]
              properties:
                agentId:
                  type: string
                query:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/MemoryRecordListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/memory/summarize:
    post:
      operationId: summarizeMemoryRecords
      tags: [Memory]
      summary: Summarize memory for long-horizon context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId]
              properties:
                agentId:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/MemorySummarySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/memory/forget:
    post:
      operationId: forgetMemoryRecords
      tags: [Memory]
      summary: Remove memory records based on policy and scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memoryIds]
              properties:
                memoryIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
      responses:
        '202':
          $ref: '#/components/responses/AcceptedNoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/usage/tasks/{taskId}:
    get:
      operationId: getTaskUsage
      tags: [Accounting]
      summary: Retrieve task usage in tokens, tool calls, and spend
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/UsageMeterSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/budgets/allocate:
    post:
      operationId: allocateBudget
      tags: [Accounting]
      summary: Allocate token and tool call budgets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/common/budget-policy.schema.json
      responses:
        '201':
          $ref: '#/components/responses/BudgetPolicyCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/budgets/enforce:
    post:
      operationId: enforceBudget
      tags: [Accounting]
      summary: Enforce budget with model routing policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/common/model-routing-policy.schema.json
      responses:
        '202':
          $ref: '#/components/responses/AcceptedNoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/evals/run:
    post:
      operationId: runEval
      tags: [ReasoningObservability]
      summary: Execute an evaluation suite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suiteId]
              properties:
                suiteId:
                  type: string
      responses:
        '202':
          $ref: '#/components/responses/EvalResultAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/evals/{evalId}:
    get:
      operationId: getEvalResult
      tags: [ReasoningObservability]
      summary: Fetch evaluation result
      parameters:
        - in: path
          name: evalId
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/EvalResultSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/agents/{agentId}/messages:
    post:
      operationId: sendAgentMessage
      tags: [AgentCoordination]
      summary: Send an agent-to-agent message
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/common/agent-message.schema.json
      responses:
        '202':
          $ref: '#/components/responses/AcceptedNoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/agents/{agentId}/handoff:
    post:
      operationId: handoffAgentTask
      tags: [AgentCoordination]
      summary: Handoff task control to another agent
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/common/handoff.schema.json
      responses:
        '202':
          $ref: '#/components/responses/AcceptedNoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/agents/{agentId}/consensus:
    post:
      operationId: resolveAgentConsensus
      tags: [AgentCoordination]
      summary: Resolve shared decision among participating agents
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/common/consensus-decision.schema.json
      responses:
        '200':
          $ref: '#/components/responses/ConsensusDecisionSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/actions/propose:
    post:
      operationId: proposeAction
      tags: [SandboxActuation]
      summary: Propose side-effecting action under sandbox policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/common/side-effect-manifest.schema.json
      responses:
        '202':
          $ref: '#/components/responses/ActionProposed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/actions/{actionId}/approve:
    post:
      operationId: approveAction
      tags: [SandboxActuation]
      summary: Approve proposed action through gate controls
      parameters:
        - in: path
          name: actionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/common/approval-gate.schema.json
      responses:
        '202':
          $ref: '#/components/responses/AcceptedNoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/actions/{actionId}/apply:
    post:
      operationId: applyAction
      tags: [SandboxActuation]
      summary: Apply an approved action
      parameters:
        - in: path
          name: actionId
          required: true
          schema:
            type: string
      responses:
        '202':
          $ref: '#/components/responses/AcceptedNoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/actions/{actionId}/rollback:
    post:
      operationId: rollbackAction
      tags: [SandboxActuation]
      summary: Roll back side effects from an applied action
      parameters:
        - in: path
          name: actionId
          required: true
          schema:
            type: string
      responses:
        '202':
          $ref: '#/components/responses/AcceptedNoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/supervision/queue:
    get:
      operationId: listSupervisionQueue
      tags: [Supervision]
      summary: List approval and intervention queue items
      responses:
        '200':
          $ref: '#/components/responses/SupervisionQueueSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/supervision/interventions:
    post:
      operationId: recordIntervention
      tags: [Supervision]
      summary: Record a human or agent supervisor intervention
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/common/intervention-record.schema.json
      responses:
        '201':
          $ref: '#/components/responses/InterventionCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/supervision/alerts:
    get:
      operationId: listDivergenceAlerts
      tags: [Supervision]
      summary: List divergence alerts against expected behavior
      responses:
        '200':
          $ref: '#/components/responses/DivergenceAlertListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/experimental/reasoning/events:
    get:
      operationId: listReasoningEvents
      tags: [ReasoningObservability]
      summary: Query reasoning and tool-call events
      responses:
        '200':
          $ref: '#/components/responses/ReasoningEventsSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StructuredError:
      $ref: ../schemas/common/structured-error.schema.json
    WorkflowState:
      $ref: ../schemas/common/workflow-state.schema.json
    CapabilityToken:
      $ref: ../schemas/common/capability-token.schema.json
    CheckpointListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: ../schemas/common/checkpoint.schema.json
    MemoryRecordListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: ../schemas/common/memory-record.schema.json
    MemorySummaryResponse:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
    UsageMeter:
      $ref: ../schemas/common/usage-meter.schema.json
    EvalResult:
      $ref: ../schemas/common/eval-result.schema.json
    SupervisionQueueResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: ../schemas/common/supervision-queue-item.schema.json
    DivergenceAlertListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: ../schemas/common/divergence-alert.schema.json
    ReasoningEventsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            anyOf:
              - $ref: ../schemas/events/reasoning-node-event.schema.json
              - $ref: ../schemas/events/tool-call-event.schema.json
    RunPlanResponse:
      type: object
      required: [negotiation, costLatencyHint]
      properties:
        negotiation:
          $ref: ../schemas/common/negotiation-hint.schema.json
        costLatencyHint:
          $ref: ../schemas/common/cost-latency-hint.schema.json
  responses:
    CapabilityTokenCreated:
      description: Capability token minted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CapabilityToken'
    CapabilityTokenSuccess:
      description: Capability token details and audit context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CapabilityToken'
    RunPlanSuccess:
      description: Run plan generated for negotiation mode.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RunPlanResponse'
    WorkflowStateAccepted:
      description: Workflow state transition accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkflowState'
    CheckpointListSuccess:
      description: Checkpoint list.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CheckpointListResponse'
    MemoryRecordCreated:
      description: Memory record persisted.
      content:
        application/json:
          schema:
            $ref: ../schemas/common/memory-record.schema.json
    MemoryRecordListSuccess:
      description: Memory query results.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemoryRecordListResponse'
    MemorySummarySuccess:
      description: Summarized memory context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemorySummaryResponse'
    UsageMeterSuccess:
      description: Usage meter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UsageMeter'
    BudgetPolicyCreated:
      description: Budget policy allocated.
      content:
        application/json:
          schema:
            $ref: ../schemas/common/budget-policy.schema.json
    EvalResultAccepted:
      description: Eval run accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EvalResult'
    EvalResultSuccess:
      description: Eval result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EvalResult'
    ConsensusDecisionSuccess:
      description: Consensus decision result.
      content:
        application/json:
          schema:
            $ref: ../schemas/common/consensus-decision.schema.json
    ActionProposed:
      description: Action proposal accepted for sandbox gating.
      content:
        application/json:
          schema:
            $ref: ../schemas/common/side-effect-manifest.schema.json
    SupervisionQueueSuccess:
      description: Supervision queue listing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SupervisionQueueResponse'
    InterventionCreated:
      description: Intervention record stored.
      content:
        application/json:
          schema:
            $ref: ../schemas/common/intervention-record.schema.json
    DivergenceAlertListSuccess:
      description: Divergence alerts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DivergenceAlertListResponse'
    ReasoningEventsSuccess:
      description: Reasoning and tool call events.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReasoningEventsResponse'
    AcceptedNoContent:
      description: Request accepted for asynchronous processing.
    StructuredErrorBadRequest:
      description: Structured error with recovery metadata.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredError'
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredError'
    Unauthorized:
      description: Missing or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredError'
    NotFound:
      description: Requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredError'
    InternalError:
      description: Unexpected internal service error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredError'
tags:
  - name: IdentityTrustV2
    description: Capability-scoped identity, delegation intent, and revocation.
  - name: Negotiation
    description: Dry run, explain, and clarification-first request planning.
  - name: DurableExecution
    description: Pause, resume, and replay-safe checkpoint lifecycle operations.
  - name: Memory
    description: Managed memory tier for retention, summarization, and forgetting.
  - name: Accounting
    description: Token and tool-call budgeting, usage, and routing policy controls.
  - name: ReasoningObservability
    description: Reasoning graph events and evaluation lifecycle contracts.
  - name: AgentCoordination
    description: Agent messaging, handoff, and consensus decision contracts.
  - name: SandboxActuation
    description: Sandboxed proposals, approval gates, apply, and rollback controls.
  - name: Supervision
    description: Human and agent supervisor queue, alerting, and interventions.
